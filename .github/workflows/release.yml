name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.2.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to the GitHub Container Registry. Without it the
      # login succeeds and the push fails at the last step.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 publishes 1.2.3, 1.2 and latest, so an Unraid template pinned to
      # :1.2 picks up patches without ever jumping a minor version unasked.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Platen
            org.opencontainers.image.description=Self-hosted photo and video backup

      # linux/amd64 only, deliberately. Unraid is x86_64, which is the whole
      # audience, and an arm64 build would cross-compile sharp, onnxruntime and
      # the CLIP runtime under QEMU for the better part of an hour to serve
      # nobody. Worth revisiting if ARM NAS users ever ask.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
